---
- name: Windows Health Report
  hosts: "{{ vm_name }}"
  gather_facts: false

  vars:
    cpu_warning: 75
    cpu_critical: 90
    memory_warning: 80
    memory_critical: 90
    disk_warning: 20
    disk_critical: 10

  tasks:
    - name: Collect Windows health metrics
      ansible.windows.win_powershell:
        script: |
          $os = Get-CimInstance Win32_OperatingSystem
          $cpu = @(Get-CimInstance Win32_Processor)
          $disks = @(Get-CimInstance Win32_LogicalDisk -Filter "DriveType=3")

          $cpuLoad = ($cpu | Measure-Object -Property LoadPercentage -Average).Average

          $memoryUsed = 100 * (
            1 - ($os.FreePhysicalMemory / $os.TotalVisibleMemorySize)
          )

          $diskResults = @(
            foreach ($disk in $disks) {
              if ($disk.Size -gt 0) {
                $freePct = 100 * $disk.FreeSpace / $disk.Size

                @{
                  Drive = $disk.DeviceID
                  FreePercent = [math]::Round($freePct, 1)
                  FreeGB = [math]::Round($disk.FreeSpace / 1GB, 1)
                  TotalGB = [math]::Round($disk.Size / 1GB, 1)
                }
              }
            }
          )

          $rebootPaths = @(
            'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Component Based Servicing\RebootPending'
            'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\WindowsUpdate\Auto Update\RebootRequired'
          )

          $pendingReboot = $false

          foreach ($path in $rebootPaths) {
            if (Test-Path $path) {
              $pendingReboot = $true
            }
          }

          $rename = Get-ItemProperty `
            'HKLM:\SYSTEM\CurrentControlSet\Control\Session Manager' `
            -Name PendingFileRenameOperations `
            -ErrorAction SilentlyContinue

          if ($rename.PendingFileRenameOperations) {
            $pendingReboot = $true
          }

          $criticalEvents = @(
            Get-WinEvent -FilterHashtable @{
              LogName = 'System', 'Application'
              Level = 1
              StartTime = (Get-Date).AddHours(-24)
            } -ErrorAction SilentlyContinue
          )

          $Ansible.Result = @{
            ComputerName = $env:COMPUTERNAME
            OperatingSystem = $os.Caption
            CPUPercent = [math]::Round($cpuLoad, 1)
            MemoryPercent = [math]::Round($memoryUsed, 1)
            Disks = $diskResults
            PendingReboot = $pendingReboot
            UptimeDays = [math]::Round(
              ((Get-Date) - $os.LastBootUpTime).TotalDays, 1
            )
            CriticalEvents24h = @($criticalEvents).Count
          }
      register: health

    - name: Initialize health checks
      ansible.builtin.set_fact:
        health_checks:
          - name: CPU
            value: "{{ health.result.CPUPercent }}%"
            status: >-
              {{
                'CRITICAL' if health.result.CPUPercent >= cpu_critical
                else 'WARNING' if health.result.CPUPercent >= cpu_warning
                else 'PASS'
              }}

          - name: Memory
            value: "{{ health.result.MemoryPercent }}%"
            status: >-
              {{
                'CRITICAL' if health.result.MemoryPercent >= memory_critical
                else 'WARNING' if health.result.MemoryPercent >= memory_warning
                else 'PASS'
              }}

          - name: Pending reboot
            value: "{{ 'Yes' if health.result.PendingReboot else 'No' }}"
            status: "{{ 'WARNING' if health.result.PendingReboot else 'PASS' }}"

          - name: Critical events (24h)
            value: "{{ health.result.CriticalEvents24h }}"
            status: >-
              {{
                'WARNING' if health.result.CriticalEvents24h > 0
                else 'PASS'
              }}

    - name: Add disk health checks
      ansible.builtin.set_fact:
        health_checks: >-
          {{
            health_checks +
            [{
              'name': 'Disk ' ~ item.Drive,
              'value': (item.FreePercent | string) ~ '% free (' ~
                       (item.FreeGB | string) ~ ' GB / ' ~
                       (item.TotalGB | string) ~ ' GB)',
              'status':
                'CRITICAL' if item.FreePercent < disk_critical
                else 'WARNING' if item.FreePercent < disk_warning
                else 'PASS'
            }]
          }}
      loop: "{{ health.result.Disks }}"
      loop_control:
        label: "{{ item.Drive }}"

    - name: Calculate overall health status
      ansible.builtin.set_fact:
        overall_status: >-
          {{
            'CRITICAL' if
              (health_checks | selectattr('status', 'equalto', 'CRITICAL') | list | length > 0)
            else 'WARNING' if
              (health_checks | selectattr('status', 'equalto', 'WARNING') | list | length > 0)
            else 'PASS'
          }}

    - name: Display Windows health report
      ansible.builtin.debug:
        msg: |
          ================================================
                    WINDOWS HEALTH REPORT
          ================================================
          Host: {{ health.result.ComputerName }}
          OS: {{ health.result.OperatingSystem }}
          Incident: {{ incident_id | default('N/A') }}
          Uptime: {{ health.result.UptimeDays }} days

          ------------------------------------------------
          HEALTH CHECKS
          ------------------------------------------------
          {% for check in health_checks %}
          [{{ '%-8s' | format(check.status | trim) }}] {{ '%-25s' | format(check.name) }} {{ check.value }}
          {% endfor %}
          ------------------------------------------------
          OVERALL STATUS: {{ overall_status | trim }}
          ================================================

    - name: Publish health summary
      ansible.builtin.set_stats:
        data:
          windows_health_status: "{{ overall_status | trim }}"
          windows_health_checks: "{{ health_checks }}"
        per_host: false

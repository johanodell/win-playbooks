---
- name: Restart approved Windows Service
  hosts: "{{ vm_name }}" 
  gather_facts: false

  vars:
    allowed_services:
      - W32Time
      - Spooler
      - W3SVC

  tasks:
    - name: Validate requested service
      ansible.builtin.assert:
        that:
          - service_name is defined
          - service_name in allowed_services
        fail_msg: "Service not approved for restart"

    - name: Restart service
      ansible.windows.win_service:
        name: "{{ service_name }}"
        state: restarted

    - name: Verify service state
      ansible.windows.win_service_info:
        name: "{{ service_name }}"
      register: result

    - name: Assert service is running
      ansible.builtin.assert:
        that:
          - result.exists
          - result.services[0].state == 'started'
